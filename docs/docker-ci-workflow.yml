# GitHub Actions CI workflow (reference copy)

This is the exact GitHub Actions workflow for this repository. It lives here as a reference file because the automation token used to push this repo does not have the `workflow` scope, which GitHub requires for pushing `.github/workflows/` files.

**To enable CI:** copy this file's content to `.github/workflows/docker-ci.yml` in the GitHub web UI (Add file → Create new file), or push it with a token/PAT that has the `workflow` scope. It triggers on the first commit that contains it.

**What it does:**
1. **build** — builds both Docker images (`worknest-app`, `worknest-db`) with layer caching
2. **verify** — boots the full `docker compose` stack, waits for the DB healthcheck and the app, then runs `docker/verify.sh` (all 13 checks, including the Base44 reverse-proxy checks) and prints the DB restore verification log
3. **publish** — on pushes to `main`, pushes both images to GHCR (`ghcr.io/<owner>/worknest-app`, `ghcr.io/<owner>/worknest-db`)

---

```yaml
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (node build → nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
          tags: worknest-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build db image (postgres + worknest.sql)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/db.Dockerfile
          push: false
          tags: worknest-db:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Boot stack & verify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack (app + db)
        run: docker compose up -d --build

      - name: Wait for database healthy
        run: |
          timeout 240 bash -c '
            until [ "$(docker inspect --format "{{.State.Health.Status}}" worknest-db)" = "healthy" ]; do
              sleep 3
            done'
          echo "db healthy"

      - name: Wait for app to serve
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8080/ >/dev/null; do sleep 3; done'
          echo "app serving"

      - name: Run verification suite
        run: ./docker/verify.sh

      - name: Show DB restore verification log
        if: always()
        run: docker logs worknest-db 2>&1 | grep -A 25 "WorkNest DB restore verification" || true

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/worknest-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push db image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/db.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/worknest-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
```
