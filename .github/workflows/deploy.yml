name: Deploy Worknest

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: worknest-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 1807

          script: |
            set -e

            PROJECT_DIR="$HOME/public_html/worknest-copy"

            echo "======================================"
            echo "Starting Worknest deployment"
            echo "======================================"

            cd "$PROJECT_DIR"

            echo "Fetching latest code..."
            git fetch origin main

            echo "Resetting to latest main branch..."
            git reset --hard origin/main

            echo "Checking current containers"

            docker ps -a

            echo "Stopping old Worknest containers"

            docker stop worknest-app 2>/dev/null || true
            docker stop worknest-db 2>/dev/null || true

            echo "Removing old Worknest containers"

            docker rm worknest-app 2>/dev/null || true
            docker rm worknest-db 2>/dev/null || true

            echo "Removing Compose project containers"

            docker ps -aq \
              --filter "label=com.docker.compose.project=worknest-copy" \
              | xargs -r docker rm -f || true

            echo "Building Docker images"

            docker-compose build

            echo "Starting containers"

            docker-compose up -d

            echo "Waiting for application startup..."
            sleep 10

            echo "Container status"

            docker-compose ps

            echo "Deployment completed successfully!"
