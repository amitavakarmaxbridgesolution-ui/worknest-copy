name: Deploy Worknest

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: worknest-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 1807

          script: |
            set -e

            PROJECT_DIR="$HOME/public_html/worknest-copy"

            echo "======================================"
            echo "Starting Worknest deployment"
            echo "======================================"

            cd "$PROJECT_DIR"

            echo "Current Git status:"
            git status

            echo "Fetching latest code..."
            git fetch origin main

            echo "Resetting to latest main branch..."
            git reset --hard origin/main

            echo "======================================"
            echo "Building Docker images..."
            echo "======================================"

            docker-compose build

            echo "======================================"
            echo "Removing old containers safely..."
            echo "======================================"

            docker-compose rm -sf || true

            echo "======================================"
            echo "Starting new containers..."
            echo "======================================"

            docker-compose up -d

            echo "Waiting for application startup..."
            sleep 10

            echo "======================================"
            echo "Container status:"
            echo "======================================"

            docker-compose ps

            echo "======================================"
            echo "Recent application logs:"
            echo "======================================"

            docker-compose logs --tail=30

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
